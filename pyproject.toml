[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chu-platform"
version = "0.1.0"
description = "CHU Platform - AI and tools package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CHU Team" },
]

dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.13.4",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.51.0",
    "pydantic-settings>=2.14.2",
    "fastapi>=0.139.0",
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "sse-starlette>=3.4.5",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[tool.uv.workspace]
members = ["apps/api"]

[project.urls]
Homepage = "https://github.com/example/chu-platform"

[tool.hatch.build]
packages = ["packages/analysis", "packages/tools", "packages/agents"]

[tool.hatch.build.targets.wheel]
packages = ["packages/analysis", "packages/tools", "packages/agents"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
