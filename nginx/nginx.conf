# Nginx load balancer / reverse proxy for the CHU Platform.
#
# Single entry point for the whole stack:
#   /          -> web app (SvelteKit, adapter-node)
#   /api/...   -> FastAPI backend (load-balanced)
#   /pgadmin/  -> PgAdmin (under a sub-path)
#
# Load balancing: the upstream blocks below round-robin across every
# `server` line. Start with one API instance and scale out with:
#   docker compose up -d --scale api=3
# (All conversation/checkpoint state lives in Postgres, so any instance
# can serve any request.)

# ── API (FastAPI) ────────────────────────────────────────────────
upstream api_servers {
    server api:10000;
    # Add more entries here when scaling, e.g.:
    # server api:10000;
    # server api:10000;
}

# ── Web app (SvelteKit) ──────────────────────────────────────────
upstream web_servers {
    server web:3000;
}

# ── PgAdmin ──────────────────────────────────────────────────────
upstream pgadmin_servers {
    server pgadmin:80;
}

server {
    listen 80;
    server_name _;

    # Large dataset uploads go through the API
    client_max_body_size 100m;

    # ── API ──────────────────────────────────────────────────────
    # The web app talks to the backend at /api/v1/... (same origin).
    # Buffering is disabled so SSE chat streams reach the browser live.
    location /api/ {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── PgAdmin (under /pgadmin) ─────────────────────────────────
    # PgAdmin runs with SCRIPT_NAME=/pgadmin and expects the full
    # /pgadmin/... path to be forwarded untouched (no prefix stripping).
    location /pgadmin/ {
        proxy_pass http://pgadmin_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # ── Web app (SvelteKit) ──────────────────────────────────────
    location / {
        proxy_pass http://web_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
