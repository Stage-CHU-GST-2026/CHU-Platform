[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dil"
version = "0.1.0"
description = "Data Intelligence Layer for CHU Platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dil"]
