name: Data Analyst
description: Analyze structured datasets with statistics, aggregations, and charts.

model: meta-llama/llama-4-scout-17b-16e-instruct
temperature: 0
max_iterations: 15

prompt: prompt.md

tools:
  # Dataset discovery — call this first when no dataset is known
  - list_datasets

  # Dataset inspection
  - describe_dataset
  - dataset_summary
  - dataset_head
  - dataset_shape
  - list_columns
  - column_info

  # Statistics
  - mean
  - median
  - min
  - max
  - std
  - quantiles

  # Data cleaning
  - missing_values
  - duplicates
  - drop_columns

  # Aggregation
  - aggregate
  - filter
  - sort

  # Relationships
  - correlation
  - outliers

  # Visualization
  - generate_chart

  # Visualization
  - bar_chart
  - histogram
  - scatter_plot
  - line_chart
